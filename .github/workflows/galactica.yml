name: Galactica Build

on:
  push:
    branches: [claude/serene-edison-xmfbql]
    paths:
      - "galactica/**"
      - ".github/workflows/galactica.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: false
        default: "galactica"
      orig_ipa_url:
        description: "Pristine IPA URL (for hash spoofing baseline)"
        required: false
        default: "https://github.com/Aoggs13/ggs/releases/download/fforig/com.dts.freefireth_1.132.1_und3fined.ipa"
      base_ipa_url:
        description: "Base IPA URL — the already-modded build we add anti-ban into"
        required: false
        default: "https://github.com/Aoggs13/ggs/releases/download/galactica-native-phase2f-20261127/Galactica_NATIVE_PHASE2F_UNVERIFIED_RESIGN.ipa"

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'galactica' }}
  ORIG_IPA_URL: ${{ github.event.inputs.orig_ipa_url || 'https://github.com/Aoggs13/ggs/releases/download/fforig/com.dts.freefireth_1.132.1_und3fined.ipa' }}
  BASE_IPA_URL: ${{ github.event.inputs.base_ipa_url || 'https://github.com/Aoggs13/ggs/releases/download/galactica-native-phase2f-20261127/Galactica_NATIVE_PHASE2F_UNVERIFIED_RESIGN.ipa' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pristine + base IPAs
        run: |
          curl -fL -o orig.ipa "$ORIG_IPA_URL"
          curl -fL -o base.ipa "$BASE_IPA_URL"
          ls -lh orig.ipa base.ipa

      - name: Extract pristine main binary and generate header
        run: |
          mkdir -p orig_unpack
          unzip -q orig.ipa -d orig_unpack
          PRISTINE=$(find orig_unpack/Payload -maxdepth 3 -type f -name FreeFire | head -1)
          echo "pristine: $PRISTINE $(wc -c < "$PRISTINE") bytes"
          cp "$PRISTINE" galactica/native/pristine_main_bin
          cd galactica/native
          xxd -i pristine_main_bin > pristine_binary.h
          head -2 pristine_binary.h
          tail -2 pristine_binary.h

      - name: Vendor fishhook
        working-directory: galactica/native
        run: |
          curl -sL -o fishhook.h https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h
          curl -sL -o fishhook.c https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c
          ls -lh fishhook.*

      - name: Build anti-ban dylib (file_spoof + fishhook only)
        working-directory: galactica/native
        run: |
          brew install ldid 2>/dev/null || true
          make all
          ls -lh libnativeunity.dylib

      - name: Patch IPA — inject anti-ban dylib + rename app to "Free Fire"
        run: |
          python3 galactica/patch_ipa.py base.ipa galactica.ipa \
            --gadget galactica/native/libnativeunity.dylib \
            --display-name "Free Fire" \
            --compress 6
          ls -lh galactica.ipa
          shasum -a 256 galactica.ipa | tee galactica.sha256

      - name: Delete old release (if exists)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Galactica — Free Fire iOS mod
          body: |
            ## Galactica

            In-game Unity-canvas mod menu for Free Fire iOS 1.132.1 (`com.dts.freefireth`).

            **features**
            - Aimbot (silent / legit / snap), FOV 0–367°, no-indicator option, shot prediction
            - ESP: box · name · HP bar · distance · bone lines · skeleton
            - No recoil · no spread · no bullet drop · instant hit
            - Auto Headshot
            - DataDome kill · AppsFlyer sanity bypass · FBSDK integrity bypass
            - JB-probe silencer (stat/fopen/access/_dyld/sysctl)
            - Anti-hack auto-stub (grows at runtime — rescans every 5 s)
            - BAN capture — logs opcode + args + stack to `Documents/ban-trace.log`
            - Guest Reset (built-in ResetGuest + FixDeviceID + keychain wipe)

            **install**
            - **TrollStore** — AirDrop / Files → Install (preferred; no revokes)
            - **Sideloadly** — Apple ID (free: 7 d / 3 app limit; paid dev: 1 y / 10 devices)
            - **ESign / Scarlet** — enterprise cert (revoke-prone)

            **how to open menu** — tap bottom-left corner of screen once.

            **ban-trace** — copy `/var/mobile/Containers/Data/Application/<GUID>/Documents/ban-trace.log` via Filza / Files sharing after a ban event.
          files: |
            galactica.ipa
            galactica.sha256
